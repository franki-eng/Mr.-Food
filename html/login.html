<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Iniciar sesión</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="login-body">

    <div class="login-box">

        <h1>🍔 Mr. Food</h1>

        <h2>Iniciar sesión</h2>

        <form id="loginForm">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre"
                required
            >

            <input
                type="email"
                id="correo"
                placeholder="Correo"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >

            <input
                type="tel"
                id="celular"
                placeholder="Celular"
                required
            >

            <button type="submit">
                Ingresar
            </button>

        </form>

        <p id="mensaje"></p>

    </div>

    <script type="module" src="../js/login.js"></script>

</body>
</html>
